<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4a3426">
  <link rel="icon" href="assets/images/logo.png">
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body class="is-ar">
  <header class="app-header">
    <div class="header-top">
      <div class="shop-brand">
        <img id="shop-logo" class="shop-logo" alt="">
        <h1 id="shop-name" class="shop-name"></h1>
      </div>
      <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Language"></button>
    </div>
    <div class="search-row">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      <input id="search-input" class="search-input" type="search" autocomplete="off" spellcheck="false">
    </div>
    <nav id="category-tabs" class="category-tabs" aria-label="Categories"></nav>
  </header>

  <main id="menu-list" class="menu-list" aria-live="polite"></main>

  <p id="empty-state" class="empty-state" hidden></p>

  <footer class="app-footer">
    <div id="footer-contacts" class="footer-contacts"></div>
    <span id="footer-flag"></span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
