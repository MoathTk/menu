<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12100E">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <title>مقهى رواق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body class="app is-ar">

  <!-- ============ Screen 1: Welcome / Splash ============ -->
  <section id="screen-splash" class="screen screen-splash">
    <div class="splash-inner">
      <div class="splash-top">
        <button id="splash-lang" class="splash-lang" type="button">EN</button>
        <button id="splash-theme" class="theme-toggle" type="button" aria-label=""></button>
      </div>
      <img id="splash-img" class="splash-img" src="assets/images/logo.png" alt="">
      <h1 id="splash-title" class="splash-title"></h1>
      <button id="start-btn" class="splash-btn" type="button">
        <span id="start-label">ادخل</span>
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ Screen 2: Home / Menu ============ -->
  <section id="screen-home" class="screen screen-home" hidden>
    <header class="home-header">
      <img id="home-logo" class="home-logo" src="assets/images/logo.png" alt="">
      <span id="home-brand" class="home-brand">مقهى رواق</span>
      <button id="home-theme" class="theme-toggle theme-toggle-home" type="button" aria-label=""></button>
    </header>

    <h1 id="home-title" class="home-title">ابحث عن أفضل قهوة لذوقك</h1>

    <div class="search-row">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="ابحث عما يعجبك">
      <button id="filter-btn" class="filter-btn" type="button" aria-label="Filter">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
    </div>

    <nav id="category-tabs" class="cat-tabs" aria-label="Categories"></nav>

    <main class="home-content">
      <div id="category-lists" class="category-lists"></div>
    </main>

    <footer class="shop-footer">
      <div class="shop-footer-contacts">
        <a id="footer-phone" class="shop-footer-link" href="#" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span id="footer-phone-label"></span>
        </a>
        <a id="footer-insta" class="shop-footer-link" href="#" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>
          <span id="footer-insta-label"></span>
        </a>
      </div>
    </footer>
  </section>

  <!-- ============ Screen 3: Item Details ============ -->
  <section id="screen-details" class="screen screen-details" hidden>
    <div class="details-hero">
      <img id="d-image" src="" alt="">
      <button id="d-back" class="circle-btn" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <div class="details-body">
      <div class="details-head">
        <div>
          <h1 id="d-name" class="details-name"></h1>
          <p id="d-sub" class="details-sub"></p>
        </div>
      </div>

      <section class="details-block">
        <h2 id="d-desc-title" class="block-title"></h2>
        <p class="desc-text">
          <span id="d-desc-short"></span><span id="d-desc-more" class="desc-more" hidden></span>
          <button id="d-read-more" class="read-more" type="button">اقرأ المزيد</button>
        </p>
      </section>
    </div>

    <div class="bottom-bar">
      <div class="price-col">
        <span id="d-price-label" class="price-label"></span>
        <strong id="d-total" class="total-price"></strong>
      </div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
